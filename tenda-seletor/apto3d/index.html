<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Itá Nobre — Maquete 3D por apartamento (prévia em teste)</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#dfe6ec}
  #hud{position:absolute;top:0;left:0;right:0;z-index:10;background:#14532d;color:#fff;padding:calc(6px + env(safe-area-inset-top)) 10px 8px;font-size:14px}
  #hud b{font-size:15px}
  #hud .tag{background:#fbbf24;color:#1f2937;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:middle}
  #hud a{color:#bbf7d0;font-size:12.5px}
  #leg{position:absolute;top:70px;right:8px;z-index:10;background:rgba(255,255,255,.95);border-radius:10px;padding:7px 10px;font-size:12px;box-shadow:0 1px 6px rgba(0,0,0,.25)}
  #leg div{margin:2px 0}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
  #det{display:none;position:fixed;left:0;right:0;bottom:0;max-height:46%;overflow:auto;background:#fff;border-top:3px solid #14532d;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));z-index:1000;font-size:14px;box-shadow:0 -4px 18px rgba(0,0,0,.25)}
  #det.min{max-height:44px !important;overflow:hidden !important}
  #detc,#detm{float:right;border:0;background:#eee;border-radius:6px;padding:4px 10px;font-weight:700}
  #detm{margin-right:6px}
  .chip{display:inline-block;padding:2px 9px;border-radius:999px;color:#fff;font-size:12px;font-weight:700;vertical-align:middle}
  #det .ac{color:#b91c1c;font-weight:700}
  #detSel{width:100%;margin-top:8px;padding:12px;font:700 15px system-ui;background:#14532d;color:#fff;border:0;border-radius:8px}
  #nota{position:absolute;bottom:8px;left:8px;z-index:9;background:rgba(17,24,39,.85);color:#e5e7eb;font-size:10.5px;line-height:1.4;padding:6px 9px;border-radius:8px;max-width:62%}
  #nota b{color:#fbbf24}
</style>
</head>
<body>
<div id="hud"><span class="tag">Prévia em teste</span><b>Itá Nobre — Maquete 3D por apartamento</b><br>
<a href="../index.html">← Versão do seletor</a></div>
<div id="leg">
  <div><span class="dot" style="background:#22c55e"></span>Disponível</div>
  <div><span class="dot" style="background:#f97316"></span>Reservado</div>
  <div><span class="dot" style="background:#dc2626"></span>Vendido</div>
  <div><span class="dot" style="background:#9ca3af"></span>A confirmar</div>
</div>
<div id="nota"><b>Estudo ilustrativo:</b> posição aproximada dos apartamentos nas torres (planta tipo, 4 por andar). Numeração e disponibilidade: confirmar na tabela.</div>
<div id="det">
<button id="detm">ver mapa ▾</button>
<button id="detc">fechar ✕</button>
<div id="detb"></div></div>
<script type="module">
import * as THREE from '../3d/three.module-V7ASZNKV.js';
import {OrbitControls} from '../3d/OrbitControls-4EM7FTJS.js';

const N = 22.6, W = 9056/N, D = 1560/N;          // px -> m (mesma escala da maquete oficial)
const BLO = [
  {id:'B1', cx:5919.4, cy:741.1, sx:14.9, sz:34.42, pav:5, h:14.2},
  {id:'B2', cx:5449.2, cy:739.7, sx:14.9, sz:35.82, pav:5, h:14.2},
  {id:'B3', cx:4978.9, cy:744.9, sx:14.9, sz:35.82, pav:5, h:14.2},
  {id:'B4', cx:4508.7, cy:749.8, sx:14.9, sz:35.82, pav:5, h:14.2},
  {id:'B5', cx:4040.4, cy:750.2, sx:14.9, sz:35.82, pav:5, h:14.2},
  {id:'B6', cx:3265.3, cy:554.7, sx:43.22, sz:14.9, pav:4, h:11.58},
];
const X = c => c/N - W/2, Z = c => c/N - D/2;
const COR = {livre:0x22c55e, reservado:0xf97316, vendido:0xdc2626, aconfirmar:0x9ca3af};
const CORCSS = {livre:'#22c55e', reservado:'#f97316', vendido:'#dc2626', aconfirmar:'#9ca3af'};
const TXT = {livre:'Disponível', reservado:'Reservado', vendido:'Vendido', aconfirmar:'A confirmar'};

let UNITS = {empreendimentos:[{id:'ita', disponibilidade:{}, disponibilidade_padrao:'livre', ref:{}}]};
try { UNITS = await (await fetch('../units.json')).json(); } catch(e){}
const ITA = (UNITS.empreendimentos||[]).find(e=>e.id==='ita') || UNITS.empreendimentos[0];
const DISP = (ITA && ITA.disponibilidade) || {}, PAD = (ITA && ITA.disponibilidade_padrao) || 'livre';
const REF = (ITA && ITA.ref) || {};
function statusApto(bloco, apto){
  const v = DISP[bloco+'-'+apto] ?? DISP[bloco+'_'+apto] ?? PAD;
  return COR[v] ? v : 'aconfirmar';
}

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe6ec);
const cam = new THREE.PerspectiveCamera(44, innerWidth/innerHeight, 0.5, 3000);
const ren = new THREE.WebGLRenderer({antialias:true});
ren.setSize(innerWidth, innerHeight);
ren.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(ren.domElement);
const ctl = new OrbitControls(cam, ren.domElement);
ctl.enableDamping = true; ctl.dampingFactor = 0.08; ctl.maxPolarAngle = Math.PI/2.15;
ctl.minDistance = 15; ctl.maxDistance = 900;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a97a5, 1.05));
const sun = new THREE.DirectionalLight(0xfff6e8, 1.5); sun.position.set(80, 140, 90); scene.add(sun);

// chão com a foto oficial da maquete
const ground = new THREE.Mesh(new THREE.PlaneGeometry(W, D), new THREE.MeshLambertMaterial({color:0x9cb07e}));
ground.rotation.x = -Math.PI/2; scene.add(ground);
new THREE.TextureLoader().load('../3d/assets/site-finished-ita-OACKZLXR.jpg', t=>{
  t.colorSpace = THREE.SRGBColorSpace;
  ground.material = new THREE.MeshLambertMaterial({map:t}); ground.material.needsUpdate = true;
});

// ---------- fachada (textura por status) ----------
function fachadaTex(st){
  const c = document.createElement('canvas'); c.width=256; c.height=256;
  const g = c.getContext('2d');
  // parede
  g.fillStyle = '#f0ebe1'; g.fillRect(0,0,256,256);
  // sombreado suave nas bordas da parede
  g.fillStyle = 'rgba(0,0,0,.06)'; g.fillRect(0,0,10,256); g.fillRect(246,0,10,256);
  // laje do piso (faixa clara no topo)
  g.fillStyle = '#ffffff'; g.fillRect(0,0,256,22);
  g.fillStyle = 'rgba(0,0,0,.12)'; g.fillRect(0,22,256,5);
  // moldura da janela na cor do status
  g.fillStyle = CORCSS[st]; g.fillRect(26,46,204,164);
  // vidro
  const grad = g.createLinearGradient(30,50,220,206);
  grad.addColorStop(0,'#46586a'); grad.addColorStop(.45,'#1e2a38'); grad.addColorStop(1,'#0f1722');
  g.fillStyle = grad; g.fillRect(36,56,184,144);
  // reflexo diagonal no vidro
  g.fillStyle = 'rgba(255,255,255,.16)';
  g.beginPath(); g.moveTo(48,200); g.lineTo(120,56); g.lineTo(150,56); g.lineTo(78,200); g.fill();
  g.beginPath(); g.moveTo(96,200); g.lineTo(168,56); g.lineTo(178,56); g.lineTo(106,200); g.fill();
  // montante central + peitoril/guarda
  g.fillStyle = CORCSS[st];
  g.fillRect(124,56,8,144);
  g.fillRect(36,150,184,7);
  // rodapé na cor do status
  g.fillRect(0,244,256,12);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
const TEX = {livre:fachadaTex('livre'), reservado:fachadaTex('reservado'), vendido:fachadaTex('vendido'), aconfirmar:fachadaTex('aconfirmar')};
const MATS = {};
for (const st of Object.keys(TEX)){
  const side = new THREE.MeshLambertMaterial({map:TEX[st]});
  const topo = new THREE.MeshLambertMaterial({color:0xd8d2c6});
  MATS[st] = [side, side, topo, topo, side, side];
}

// núcleo da torre (fecha as frestas entre apartamentos) + laje de cobertura
const coreMat = new THREE.MeshLambertMaterial({color:0xe6e0d4});
const roofMat = new THREE.MeshLambertMaterial({color:0xfafafa});

function rotuloSprite(txt, x, y, z){
  const c = document.createElement('canvas'); c.width=320; c.height=160;
  const g = c.getContext('2d');
  g.fillStyle='rgba(255,255,255,.96)'; g.beginPath(); g.roundRect(20,18,280,124,26); g.fill();
  g.lineWidth=7; g.strokeStyle='#14532d'; g.stroke();
  g.fillStyle='#14532d'; g.textAlign='center'; g.textBaseline='middle';
  g.font='700 40px system-ui'; g.fillText('BLOCO',160,62);
  g.font='800 62px system-ui'; g.fillText(txt,160,116);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c), depthTest:false, transparent:true}));
  sp.scale.set(13,6.5,1); sp.position.set(x,y,z); sp.renderOrder = 5; scene.add(sp);
}

const cells = [];
let minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9,maxH=0;
for (const b of BLO){
  const cx = X(b.cx), cz = Z(b.cy);
  const long = Math.max(b.sx, b.sz), alongX = b.sx >= b.sz;
  const fh = b.h / b.pav, uw = long/4;
  // núcleo
  const core = new THREE.Mesh(new THREE.BoxGeometry(b.sx-0.18, b.h, b.sz-0.18), coreMat);
  core.position.set(cx, b.h/2, cz); scene.add(core);
  // laje de cobertura
  const roof = new THREE.Mesh(new THREE.BoxGeometry(b.sx+0.7, 0.5, b.sz+0.7), roofMat);
  roof.position.set(cx, b.h+0.25, cz); scene.add(roof);
  for (let f=1; f<=b.pav; f++){
    for (let u=1; u<=4; u++){
      const apto = f*100 + u;
      const st = statusApto(b.id, apto);
      const w = uw*0.94, d = (alongX? b.sz : b.sx)*0.97;
      const geo = new THREE.BoxGeometry(alongX? w : d, fh*0.9, alongX? d : w);
      const m = new THREE.Mesh(geo, MATS[st]);
      const off = -long/2 + uw*(u-0.5);
      m.position.set(cx + (alongX? off : 0), fh*(f-0.5), cz + (alongX? 0 : off));
      m.userData = {bloco:b.id, apto, andar:f, st, w:(alongX?w:d), h:fh*0.9, d:(alongX?d:w)};
      scene.add(m); cells.push(m);
    }
  }
  rotuloSprite(b.id, cx, b.h + 6.4, cz);
  minX=Math.min(minX,cx-b.sx/2); maxX=Math.max(maxX,cx+b.sx/2);
  minZ=Math.min(minZ,cz-b.sz/2); maxZ=Math.max(maxZ,cz+b.sz/2);
  maxH=Math.max(maxH,b.h);
}

// ---------- enquadramento (foco nas torres, não na faixa de terreno inteira) ----------
const alvo = new THREE.Vector3((minX+maxX)/2, maxH*0.45, (minZ+maxZ)/2);
const spanX = maxX-minX, spanZ = maxZ-minZ, span = Math.max(spanX, spanZ);
function enquadrar(){
  cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix();
  const vfov = cam.fov*Math.PI/180;
  const hfov = 2*Math.atan(Math.tan(vfov/2)*cam.aspect);
  const needW = (spanX*1.14/2)/Math.tan(hfov/2);
  const needH = ((maxH + spanZ*0.85)*1.18/2)/Math.tan(vfov/2);
  const dist = Math.min(800, Math.max(60, needW, needH));
  const az = 0.62, el = 0.60;
  const dir = new THREE.Vector3(Math.sin(az)*Math.cos(el), Math.sin(el), Math.cos(az)*Math.cos(el));
  cam.position.copy(alvo).addScaledVector(dir, dist);
  ctl.target.copy(alvo);
}
enquadrar(); ctl.update();

// ---------- seleção ----------
let selBox = null, selLbl = null, sel = null;
function marcaSelecao(m){
  limpaSelecao();
  const u = m.userData;
  selBox = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(u.w+0.5, u.h+0.5, u.d+0.5)),
    new THREE.LineBasicMaterial({color:0xfacc15}));
  selBox.position.copy(m.position); scene.add(selBox);
  const c = document.createElement('canvas'); c.width=384; c.height=128;
  const g = c.getContext('2d');
  g.fillStyle='#facc15'; g.beginPath(); g.roundRect(8,14,368,100,22); g.fill();
  g.fillStyle='#1f2937'; g.font='800 52px system-ui'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText(`${u.bloco} · ap ${u.apto}`,192,66);
  selLbl = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c), depthTest:false, transparent:true}));
  selLbl.scale.set(11,3.7,1); selLbl.position.set(m.position.x, m.position.y + u.h/2 + 3.4, m.position.z);
  selLbl.renderOrder = 6; scene.add(selLbl);
}
function limpaSelecao(){
  if (selBox){ scene.remove(selBox); selBox.geometry.dispose(); selBox.material.dispose(); selBox=null; }
  if (selLbl){ scene.remove(selLbl); selLbl.material.map.dispose(); selLbl.material.dispose(); selLbl=null; }
  if (sel){ sel.material.emissive && sel.material.emissive.setHex(0); sel=null; }
}

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let downAt = 0;
ren.domElement.addEventListener('pointerdown', ()=>{ downAt = performance.now(); });
ren.domElement.addEventListener('pointerup', ev=>{
  if (performance.now() - downAt > 220) return;      // foi arraste, não toque
  ptr.x = (ev.clientX/innerWidth)*2 - 1; ptr.y = -(ev.clientY/innerHeight)*2 + 1;
  ray.setFromCamera(ptr, cam);
  const hit = ray.intersectObjects(cells)[0];
  if (!hit) return;
  limpaSelecao();
  sel = hit.object;
  sel.material = MATS[sel.userData.st].map(m2=>m2.clone());
  sel.material.forEach(mm=>{ if(mm.emissive){ mm.emissive = new THREE.Color(0x1d4ed8); mm.emissiveIntensity = 0.28; } });
  marcaSelecao(sel);
  mostraApto(sel.userData);
});

function mostraApto(u){
  const det = document.getElementById('det'), detb = document.getElementById('detb');
  const stTxt = TXT[u.st], stCor = CORCSS[u.st];
  const linha = (k,v,ac)=>`<tr><td style="padding:3px 8px 3px 0;color:#4b5563">${k}</td><td>${ac?`<span class="ac">${v}</span>`:`<b>${v}</b>`}</td></tr>`;
  detb.innerHTML = `
    <b>Itá Nobre — Bloco ${u.bloco}, apartamento ${u.apto}</b>
    <span class="chip" style="background:${stCor}">${stTxt}</span>
    <span style="font-size:13px;color:#374151"> · ${u.andar}º andar</span><br>
    <span style="font-size:12px;color:#555">${ITA.disponibilidade_fonte || 'Disponibilidade: confirmar na tabela.'}</span>
    <table style="margin-top:6px;border-collapse:collapse">
      ${linha('Metragem', REF.metragem || 'a confirmar', !REF.metragem)}
      ${linha('Condição', REF.condicao || 'a confirmar', !REF.condicao)}
      ${linha('Valor de tabela da unidade', 'a confirmar', true)}
      ${linha('Sinal', REF.sinal || 'a confirmar', !REF.sinal)}
      ${linha('Mensais', REF.mensais || 'a confirmar', !REF.mensais)}
      ${linha('Intermediárias', REF.intermediarias || 'a confirmar', !REF.intermediarias)}
      ${linha('Parcelas (financiamento)', REF.parcelas || 'a confirmar', !REF.parcelas)}
    </table>
    <span style="font-size:12px;color:#555">Valores de referência por empreendimento (não por apartamento). Conferir tabela vigente. Estudo ilustrativo, não é proposta oficial.</span><br>
    <button id="detSel">Ver este apartamento no seletor completo</button>`;
  det.style.display='block'; det.classList.remove('min'); document.getElementById('detm').textContent='ver mapa ▾';
  document.getElementById('detSel').onclick = ()=>{ location.href = '../index.html'; };
}
document.getElementById('detc').onclick = ()=>{ document.getElementById('det').style.display='none'; limpaSelecao(); };
document.getElementById('detm').onclick = ()=>{ const d=document.getElementById('det'), m=document.getElementById('detm'); d.classList.toggle('min'); m.textContent = d.classList.contains('min') ? 'reabrir ▴' : 'ver mapa ▾'; };

addEventListener('resize', ()=>{ cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix(); ren.setSize(innerWidth, innerHeight); });
let t0 = performance.now();
(function loop(){
  requestAnimationFrame(loop);
  if (selBox){ const s = 1 + 0.05*Math.sin((performance.now()-t0)/180); selBox.scale.set(s,1,s); }
  ctl.update(); ren.render(scene, cam);
})();
</script>
</body>
</html>
